<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Discuss Room{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ static_v('styles.css') }}">
  {% if include_katex %}
  <link rel="stylesheet" href="/static/katex/katex.min.css">
  <script defer src="/static/katex/katex.min.js"></script>
  <script defer src="/static/katex/auto-render.min.js" onload="
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
  "></script>
  {% endif %}
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  {% include "partials/_nav.html" %}
  <main class="{% block main_class %}container page{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  {% if current_admin %}
    {% include "partials/_settings_modal.html" %}
  {% endif %}
</body>
</html>
